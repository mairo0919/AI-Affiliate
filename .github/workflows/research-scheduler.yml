name: Research Scheduler

on:
  schedule:
    # Every 15 minutes — grace window for delayed Actions runners
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scheduler:
    runs-on: ubuntu-latest
    # Missing DATABASE_URL exits safely. Missing DMM / webhook secrets must not
    # keep the workflow red while API approval is pending.

    env:
      NODE_ENV: production
      LOG_LEVEL: info
      RESEARCH_SCHEDULE_FAILURE_LIMIT: "5"
      RESEARCH_RETRY_ENABLED: "true"
      RESEARCH_RETRY_MAX_ATTEMPTS: "3"
      RESEARCH_RETRY_BASE_DELAY_SECONDS: "300"
      RESEARCH_RETRY_MAX_DELAY_SECONDS: "3600"
      RESEARCH_NOTIFICATION_ENABLED: "true"
      RESEARCH_NOTIFICATION_CHANNEL: "console"
      RESEARCH_NOTIFICATION_TIMEOUT_MS: "10000"
      RESEARCH_NOTIFICATION_MAX_ATTEMPTS: "3"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DMM_API_ID: ${{ secrets.DMM_API_ID }}
      DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
      RESEARCH_NOTIFICATION_WEBHOOK_URL: ${{ secrets.RESEARCH_NOTIFICATION_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DATABASE_URL
        id: dbcheck
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is not set; exiting safely without running the scheduler."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.dbcheck.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        if: steps.dbcheck.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.dbcheck.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        if: steps.dbcheck.outputs.skip != 'true'
        run: pnpm db:generate

      - name: Run scheduler (due schedules + retries + notifications)
        if: steps.dbcheck.outputs.skip != 'true'
        run: pnpm research:scheduler:run
        # DMM_* and webhook URL may be empty. Missing credentials → SKIPPED.
        # Secrets must never be echoed.
