<style id="otonaselect-age-boot-css">
html:not(.otonaselect-age-ok) body>*:not(#otonaselect-age-gate-root){visibility:hidden!important}
html:not(.otonaselect-age-ok){background:#f7f7f7}
#otonaselect-age-gate-root{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;padding:1.5rem;box-sizing:border-box;background:linear-gradient(165deg,#f7f7f7 0%,#fff 45%,#f0f0f0 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Helvetica Neue",Arial,sans-serif;color:#1a1a1a}
html.otonaselect-age-ok #otonaselect-age-gate-root{display:none!important}
#otonaselect-age-gate-root .os-age-panel{max-width:28rem;width:100%;margin:0 auto;padding:2rem 1.5rem;background:#fff;border:1px solid #e6e6e6;border-radius:4px;text-align:center}
#otonaselect-age-gate-root .os-age-brand{margin:0 0 1.25rem;font-size:1.5rem;font-weight:700;letter-spacing:.04em}
#otonaselect-age-gate-root .os-age-title{margin:0 0 .75rem;font-size:1.05rem;font-weight:600;line-height:1.55}
#otonaselect-age-gate-root .os-age-text{margin:0 0 .5rem;font-size:.9375rem;line-height:1.7}
#otonaselect-age-gate-root .os-age-actions{display:flex;flex-direction:column;gap:.75rem;margin-top:1.25rem}
#otonaselect-age-gate-root .os-age-btn{display:block;width:100%;min-height:3rem;padding:.85rem 1rem;font-size:1rem;font-weight:600;border-radius:4px;border:1px solid #222;cursor:pointer;background:#fff;color:#222;text-decoration:none;text-align:center;box-sizing:border-box}
#otonaselect-age-gate-root .os-age-btn.is-primary{background:#222;color:#fff}
@media (min-width:640px){#otonaselect-age-gate-root .os-age-actions{flex-direction:row}#otonaselect-age-gate-root .os-age-btn{flex:1}}
</style>
<div id="otonaselect-age-gate-root" role="dialog" aria-modal="true" aria-label="年齢確認">
  <div class="os-age-panel" id="otonaselect-age-gate-panel">
    <p class="os-age-brand">オトナセレクト</p>
    <h1 class="os-age-title">このサイトは成人向けコンテンツを含みます。</h1>
    <p class="os-age-text">18歳未満の方はご利用いただけません。</p>
    <div class="os-age-actions">
      <button type="button" class="os-age-btn is-primary" data-age="accept">18歳以上です</button>
      <button type="button" class="os-age-btn" data-age="deny">18歳未満です</button>
    </div>
  </div>
</div>
<script id="otonaselect-age-boot">
(function () {
  var COOKIE = "otonaselect_age_ok";
  var ua = navigator.userAgent || "";
  function isBot() {
    return /Googlebot|Google-InspectionTool|Storebot-Google|AdsBot-Google|bingbot|BingPreview|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|WhatsApp|Applebot|PetalBot|Bytespider/i.test(ua);
  }
  function readCookie() {
    var parts = document.cookie.split(";");
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].replace(/^\s+/, "");
      if (p.indexOf(COOKIE + "=") === 0) return decodeURIComponent(p.slice(COOKIE.length + 1));
    }
    return "";
  }
  function writeCookie(val, maxAge) {
    var secure = location.protocol === "https:" ? "; Secure" : "";
    document.cookie = COOKIE + "=" + encodeURIComponent(val) + "; Max-Age=" + maxAge + "; Path=/; SameSite=Lax" + secure;
  }
  function postEvent(type) {
    try {
      var endpoint = (window.otonaselectAnalytics && window.otonaselectAnalytics.endpoint) || "/wp-json/otonaselect/v1/events";
      var body = JSON.stringify({ type: type, path: location.pathname });
      if (navigator.sendBeacon) navigator.sendBeacon(endpoint, new Blob([body], { type: "application/json" }));
      else fetch(endpoint, { method: "POST", headers: { "content-type": "application/json" }, body: body, keepalive: true, credentials: "omit" }).catch(function () {});
      if (window.gtag) { try { window.gtag("event", type); } catch (e) {} }
    } catch (e) {}
  }
  function unlock() {
    document.documentElement.classList.add("otonaselect-age-ok");
  }
  function showDenied() {
    var panel = document.getElementById("otonaselect-age-gate-panel");
    if (!panel) return;
    panel.innerHTML = '<p class="os-age-brand">オトナセレクト</p><h1 class="os-age-title">ご利用いただけません</h1><p class="os-age-text">18歳未満の方はご利用いただけません。</p><p class="os-age-text">成人向けの記事・画像・一覧は表示しません。</p><div class="os-age-actions"><a class="os-age-btn" href="https://www.google.com/">サイトを離れる</a></div>';
  }
  if (isBot()) { unlock(); return; }
  var value = readCookie();
  if (value === "1") { unlock(); return; }
  if (value === "0") { showDenied(); return; }
  postEvent("age_gate_view");
  var root = document.getElementById("otonaselect-age-gate-root");
  if (!root) return;
  root.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var choice = t.getAttribute("data-age");
    if (choice === "accept") {
      writeCookie("1", 30 * 24 * 60 * 60);
      postEvent("age_gate_accepted");
      unlock();
      return;
    }
    if (choice === "deny") {
      writeCookie("0", 24 * 60 * 60);
      postEvent("age_gate_denied");
      showDenied();
    }
  });
})();
</script>
